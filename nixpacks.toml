# Nixpacks build for mikeos-storyteller-cloud (FastAPI + asyncpg story library, free-GPU generation)
[phases.setup]
nixPkgs = ["python312", "gcc"]

[phases.install]
cmds = ["python -m venv /opt/venv", ". /opt/venv/bin/activate && pip install --upgrade pip && pip install -r requirements.txt"]

[start]
cmd = "/opt/venv/bin/uvicorn server.http_server:app --host 0.0.0.0 --port $PORT"
